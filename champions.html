  <script>
    const REAL_FACTIONS = ['All','Baratheon','Blacks','Bolton','Brotherhood','Free Cities','Free Folk','Greens','Greyjoy','Lannister',"Night's Watch",'Stark','Targaryen','No Faction','Dual Faction'];
    let all = [];
    let factionFilter = 'all';
    function render() {
      const q = (document.getElementById('search').value || '').toLowerCase().trim();
      const filtered = all.filter(c => {
        if (factionFilter !== 'all') {
          const facs = (c.factions || []).map(f => f.toLowerCase());
          if (!facs.includes(factionFilter.toLowerCase())) return false;
        }
        if (!q) return true;
        return (c.name + ' ' + (c.roles||[]).join(' ') + ' ' + (c.factions||[]).join(' ')).toLowerCase().includes(q);
      });
      document.getElementById('resultCount').textContent = filtered.length + ' legendary champions';
      document.getElementById('list').innerHTML = filtered.map(c => `
        <div class="card rounded-xl p-4">
          <div class="flex gap-3">${avatarHTML(c, 48)}<div class="min-w-0 flex-1">
            <div class="font-semibold text-[#f0ebe0]">${c.name}</div>
            <div class="text-xs text-[#8a8680] mt-0.5">${(c.roles||[]).join(' · ')}</div>
            <div class="text-[11px] text-[#6a6660] mt-0.5">${(c.factions||[]).join(' · ')}</div>
          </div></div>
        </div>`).join('') || '<p class="text-[#6a6660]">No matches.</p>';
    }
    document.getElementById('search').addEventListener('input', render);
    const chips = document.getElementById('factionChips');
    REAL_FACTIONS.forEach(f => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (f === 'All' ? ' active' : '');
      btn.dataset.faction = f === 'All' ? 'all' : f;
      btn.textContent = f;
      chips.appendChild(btn);
    });
    chips.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        factionFilter = btn.dataset.faction;
        chips.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });
    fetchChampions().then(champs => {
      all = champs.sort((a,b) => a.name.localeCompare(b.name));
      render();
    });
  </script>
