  <script>
    let allChamps = [];
    let roster = loadRoster();
    function updateCount() {
      const n = Object.keys(roster).filter(id => roster[id] && roster[id].owned).length;
      document.getElementById('countLine').textContent = n + ' marked';
    }
    function render() {
      const grid = document.getElementById('rosterGrid');
      grid.innerHTML = allChamps.map(c => {
        const owned = isOwned(roster, c.id);
        return `<button data-id="${c.id}" class="card rounded-xl p-4 text-left ${owned ? 'owned' : ''}"><div class="flex items-center gap-3">${avatarHTML(c, 44)}<div class="min-w-0 flex-1"><div class="font-semibold text-sm leading-snug text-[#f0ebe0]" style="white-space:normal;word-break:break-word">${c.name}</div><div class="text-xs text-[#8a8680] mt-0.5">${(c.roles||[]).slice(0,2).join(' · ')}</div></div></div></button>`;
      }).join('');
      grid.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { roster = toggleOwned(roster, btn.dataset.id); render(); updateCount(); });
      });
      updateCount();
    }
    document.getElementById('selectAll').onclick = () => { roster = setAllOwned(roster, allChamps, true); render(); };
    document.getElementById('clearAll').onclick = () => { roster = setAllOwned(roster, allChamps, false); render(); };
    fetchChampions().then(champs => { allChamps = champs.sort((a,b) => a.name.localeCompare(b.name)); render(); });
  </script>
