<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Roster – GOT Legends Guide</title>
  <meta name="description" content="Mark the champions you own. Data stays in your browser only." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            got: { gold: '#c9a227', dark: '#0c0c0f', card: '#16161a', border: '#2a2a32' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0c0c0f; color: #e5e5e5; }
    .gold { color: #c9a227; }
    .card { background: #16161a; border: 1px solid #2a2a32; }
  </style>
</head>
<body class="min-h-screen">

  <header class="border-b border-got-border sticky top-0 bg-got-dark/95 backdrop-blur z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-full bg-got-gold flex items-center justify-center font-bold text-black text-sm shrink-0">GOT</div>
        <div class="min-w-0">
          <div class="font-bold text-lg tracking-wide truncate">GOT Legends Guide</div>
          <div class="text-xs text-gray-400">Build smarter teams</div>
        </div>
      </a>
      <nav class="hidden md:flex gap-4 text-sm">
        <a href="roster.html" class="text-got-gold font-semibold">My Roster</a>
        <a href="builder.html" class="hover:text-got-gold transition">Team Builder</a>
        <a href="status-effects.html" class="hover:text-got-gold transition">Status Effects</a>
        <a href="factions.html" class="hover:text-got-gold transition">Factions</a>
        <a href="champions.html" class="hover:text-got-gold transition">Champions</a>
      </nav>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-2">My Roster</h1>
    <p class="text-gray-400 mb-6">Tap champions you own. Everything is saved only in this browser.</p>

    <div class="flex flex-wrap gap-3 mb-6">
      <button id="selectAll" class="card px-4 py-2 rounded-lg text-sm hover:border-got-gold transition">Select All</button>
      <button id="clearAll" class="card px-4 py-2 rounded-lg text-sm hover:border-got-gold transition">Clear All</button>
      <a href="builder.html" class="bg-got-gold text-black font-bold px-4 py-2 rounded-lg text-sm">Go to Team Builder →</a>
    </div>

    <div id="rosterGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
  </section>

  <footer class="border-t border-got-border py-8 text-center text-sm text-gray-500">
    <div class="font-medium text-gray-400">gotlegendsguide.com</div>
    <div class="mt-1">Data never leaves your device</div>
  </footer>

  <script src="app.js"></script>
  <script>
    let allChamps = [];
    let owned = loadRoster();

    function render() {
      const grid = document.getElementById('rosterGrid');
      grid.innerHTML = allChamps.map(c => {
        const isOwned = owned.includes(c.id);
        return `
          <button data-id="${c.id}" class="card rounded-xl p-3 text-left transition ${isOwned ? 'border-got-gold ring-1 ring-got-gold/40' : 'hover:border-got-gold/50'}">
            <div class="flex items-center gap-2">
              ${avatarHTML(c, 40)}
              <div class="min-w-0">
                <div class="font-semibold text-sm truncate">${c.name}</div>
                <div class="text-xs text-gray-400">${(c.roles || []).slice(0,2).join(' · ')}</div>
              </div>
            </div>
          </button>`;
      }).join('');

      grid.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          if (owned.includes(id)) owned = owned.filter(x => x !== id);
          else owned.push(id);
          saveRoster(owned);
          render();
        });
      });
    }

    document.getElementById('selectAll').onclick = () => {
      owned = allChamps.map(c => c.id);
      saveRoster(owned);
      render();
    };
    document.getElementById('clearAll').onclick = () => {
      owned = [];
      saveRoster(owned);
      render();
    };

    fetchChampions().then(champs => {
      allChamps = champs.sort((a,b) => a.name.localeCompare(b.name));
      render();
    });
  </script>
</body>
</html>
